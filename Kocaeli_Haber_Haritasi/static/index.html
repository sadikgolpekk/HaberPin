<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kocaeli Haber Haritası</title>
    <!-- Use Tailwind CSS for rapid and modern UI prototyping -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-gray-50 h-screen flex flex-col font-sans overflow-hidden">
    
    <!-- Top Navbar -->
    <nav class="bg-blue-900 text-white shadow-lg z-10 p-4 shrink-0 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <i class="fas fa-map-marked-alt text-2xl text-blue-300"></i>
            <h1 class="text-2xl font-bold tracking-tight">Kocaeli Haber Haritası</h1>
        <div class="flex space-x-3">
            <button id="btn-clear" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg font-medium transition flex items-center shadow">
                <i class="fas fa-trash-alt mr-2"></i> Haberleri Temizle
            </button>
            <button id="btn-scrape" class="bg-green-500 hover:bg-green-600 px-4 py-2 rounded-lg font-medium transition flex items-center shadow">
                <i class="fas fa-sync-alt mr-2"></i> Yeni Haberleri Çek
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="flex flex-1 h-full overflow-hidden">
        
        <!-- Sidebar Filters -->
        <aside class="w-80 bg-white shadow-xl flex flex-col z-10 shrink-0">
            <div class="p-6 overflow-y-auto">
                <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2"><i class="fas fa-filter mr-2 text-blue-600"></i> Filtreleme</h2>
                
                <form id="filter-form" class="space-y-6">
                    <!-- Category Filter -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Haber Türü</label>
                        <select id="filter-category" class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 bg-gray-50 p-2.5 border">
                            <option value="">Tümü</option>
                            <option value="Trafik Kazası">🚗 Trafik Kazası</option>
                            <option value="Yangın">🔥 Yangın</option>
                            <option value="Elektrik Kesintisi">⚡ Elektrik Kesintisi</option>
                            <option value="Hırsızlık">🕵️ Hırsızlık</option>
                            <option value="Kültürel Etkinlikler">🎭 Kültürel Etkinlikler</option>
                        </select>
                    </div>

                    <!-- District Filter -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">İlçe</label>
                        <select id="filter-district" class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 bg-gray-50 p-2.5 border">
                            <option value="">Tümü Kocaeli</option>
                            <option value="İzmit">İzmit</option>
                            <option value="Gebze">Gebze</option>
                            <option value="Derince">Derince</option>
                            <option value="Darıca">Darıca</option>
                            <option value="Gölcük">Gölcük</option>
                            <option value="Körfez">Körfez</option>
                            <option value="Kartepe">Kartepe</option>
                            <option value="Başiskele">Başiskele</option>
                            <option value="Karamürsel">Karamürsel</option>
                            <option value="Kandıra">Kandıra</option>
                            <option value="Dilovası">Dilovası</option>
                            <option value="Çayırova">Çayırova</option>
                        </select>
                    </div>

                    <!-- Date Filters -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Zaman Dilimi</label>
                        <select id="filter-timeframe" class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 bg-gray-50 p-2.5 border">
                            <option value="">Son 3 Gün (Tümü)</option>
                            <option value="0">Bugün</option>
                            <option value="1">Dün</option>
                            <option value="2">2 Gün Önce</option>
                        </select>
                    </div>

                    <!-- Action Buttons -->
                    <div class="pt-4 flex space-x-3">
                        <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-md shadow transition font-medium">Uygula</button>
                        <button type="button" id="btn-reset" class="px-4 py-2.5 border border-gray-300 text-gray-700 rounded-md hover:bg-gray-100 transition font-medium">Sıfırla</button>
                    </div>
                </form>

                <div class="mt-8 border-t pt-4">
                    <h3 class="text-[15px] font-bold text-gray-800 mb-2">Son Haberler:</h3>
                    <div id="latest-news-list" class="flex flex-col">
                        <!-- JS WILL POPULATE THIS -->
                    </div>
                </div>
            </div>
            
            <div id="status-message" class="mt-auto bg-gray-100 p-4 border-t text-sm text-gray-600 hidden">
                <i class="fas fa-spinner fa-spin mr-2 text-blue-600"></i> <span id="status-text">Yükleniyor...</span>
            </div>
        </aside>

        <!-- Map Container -->
        <main class="flex-1 relative">
            <div id="map" class="absolute inset-0 w-full h-full"></div>
        </main>
    </div>

    <!-- The Google Maps API script tag will be injected by FastAPI via Jinja template rendering -->
    <script>
        // Global error handler for Google Maps authentication/billing errors
        function gm_authFailure() {
            console.error("Google Maps authentication failed!");
            document.getElementById('map').innerHTML = `
                <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:32px;text-align:center;border:2px dashed #fca5a5;background:#fef2f2;color:#dc2626;border-radius:8px;">
                    <h2 style="font-size:1.2rem;font-weight:bold;margin-bottom:8px;">Harita Yüklenemedi</h2>
                    <p style="font-size:0.85rem;">Google Maps API Anahtarı veya Faturalandırma hatası. F12 Konsolunu kontrol edin.</p>
                </div>
            `;
        }
    </script>
    <!-- Clusterer loads BEFORE Maps API so it's ready when initMap() fires -->
    <script src="https://unpkg.com/@googlemaps/markerclusterer/dist/index.min.js"></script>
    <script src="/static/app.js?v=4"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key={{ api_key }}&loading=async&callback=initMap" defer></script>
</body>
</html>
